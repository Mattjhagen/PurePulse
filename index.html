<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PurePulse — Web Design &amp; Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ── RESET & ROOT ─────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070D;
  --v:#7B2FFF;
  --vg:#A066FF;
  --c:#00D4FF;
  --w:#F4F4FF;
  --mu:rgba(244,244,255,0.36);
}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Space Grotesk',sans-serif;color:var(--w)}

/* ── SHARED INTRO SHELL ───────────────────────────────── */
#intro{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;background:var(--bg);
}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}

/* Logotype shared */
.lw{position:relative;z-index:2;text-align:center;user-select:none;pointer-events:none}
.ln{
  font-size:clamp(3.5rem,10vw,9rem);font-weight:700;
  letter-spacing:-0.03em;line-height:1;
  display:flex;justify-content:center;overflow:hidden;
}
.char{display:inline-block;transform:translateY(115%);opacity:0}
.accent{color:var(--vg)}
.lt{
  margin-top:1rem;font-family:'Inter',sans-serif;
  font-size:clamp(0.7rem,1.9vw,1rem);font-weight:300;
  letter-spacing:0.28em;text-transform:uppercase;
  color:var(--mu);opacity:0;transform:translateY(8px);
  transition:opacity 0.6s,transform 0.6s;
}
.badge{
  display:inline-flex;align-items:center;gap:0.5rem;
  margin-top:1.1rem;font-family:'Inter',sans-serif;
  font-size:0.68rem;letter-spacing:0.18em;text-transform:uppercase;
  color:rgba(0,212,255,0.55);opacity:0;transition:opacity 0.4s;
}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--c);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* Noise grain */
#intro::after{
  content:'';position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:0.025;pointer-events:none;z-index:1;
}

/* Skip button */
#skip{
  position:absolute;bottom:2.5rem;right:2.5rem;
  font-family:'Inter',sans-serif;font-size:0.75rem;
  font-weight:400;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--mu);background:none;border:none;cursor:pointer;
  z-index:10;opacity:0;display:flex;align-items:center;gap:0.45rem;
  transition:color 0.2s;
}
#skip:hover{color:var(--w)}
#skip svg{width:13px;height:13px}

/* Variant label (bottom-left, subtle) */
#vlabel{
  position:absolute;bottom:2.5rem;left:2.5rem;
  font-family:'Inter',sans-serif;font-size:0.62rem;
  letter-spacing:0.14em;text-transform:uppercase;
  color:rgba(244,244,255,0.15);z-index:10;opacity:0;
  transition:opacity 1s ease 1s;
}

/* Exit */
#intro.exit{animation:iout 0.9s cubic-bezier(0.76,0,0.24,1) forwards}
@keyframes iout{to{opacity:0;transform:scale(1.04)}}

/* ── MAIN SITE ────────────────────────────────────────── */
#site{
  position:fixed;inset:0;opacity:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 0.85s ease 0.45s;font-family:'Space Grotesk',sans-serif;color:var(--w);
}
#site.vis{opacity:1}
nav{position:absolute;top:0;left:0;right:0;padding:2rem 2.5rem;display:flex;align-items:center;justify-content:space-between}
.nlogo{font-size:1.15rem;font-weight:700;letter-spacing:-0.02em}.nlogo span{color:var(--vg)}
.nlinks{display:flex;gap:2rem;list-style:none}
.nlinks a{font-size:0.84rem;color:var(--mu);text-decoration:none;transition:color 0.2s}.nlinks a:hover{color:var(--w)}
.hero{text-align:center;max-width:800px;padding:0 2rem}
.hero h1{font-size:clamp(2.4rem,6vw,5rem);font-weight:700;line-height:1.05;letter-spacing:-0.03em;margin-bottom:1.5rem}
.hero h1 em{font-style:normal;color:var(--vg)}
.hero p{font-family:'Inter',sans-serif;font-size:1.05rem;font-weight:300;color:var(--mu);line-height:1.75;max-width:540px;margin:0 auto 2.5rem}
.cta{
  display:inline-flex;align-items:center;gap:0.55rem;
  background:var(--v);color:#fff;padding:0.85rem 2rem;
  border-radius:100px;font-size:0.9rem;font-weight:600;
  letter-spacing:0.02em;text-decoration:none;
  box-shadow:0 0 40px rgba(123,47,255,0.35);
  transition:box-shadow 0.3s,transform 0.2s;
}
.cta:hover{box-shadow:0 0 65px rgba(123,47,255,0.55);transform:translateY(-2px)}
</style>
</head>
<body>

<!-- ── INTRO SHELL ── -->
<div id="intro">
  <canvas id="cv"></canvas>
  <div class="lw">
    <div class="ln" id="name" aria-label="PurePulse"></div>
    <div class="lt" id="tag">Web Design &amp; Development</div>
    <div class="badge" id="badge"><span class="badge-dot"></span><span id="badgeText"></span></div>
  </div>
  <button id="skip" aria-label="Skip intro">
    Skip
    <svg viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M2 6.5h9M8 3.5l3 3-3 3"/>
    </svg>
  </button>
  <div id="vlabel"></div>
</div>

<!-- ── MAIN SITE ── -->
<div id="site">
  <nav>
    <div class="nlogo">Pure<span>Pulse</span></div>
    <ul class="nlinks">
      <li><a href="#">Work</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
  <div class="hero">
    <h1>Design that <em>moves</em><br>people forward</h1>
    <p>PurePulse builds web experiences with sharp aesthetics, clean code, and a creative instinct you can feel on every scroll.</p>
    <a href="home.html" class="cta">See our work ↗</a>
  </div>
</div>

<script>
'use strict';

// ── SHARED HELPERS ─────────────────────────────────────
const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const nameEl = document.getElementById('name');
const tagEl  = document.getElementById('tag');
const badgeEl= document.getElementById('badge');
const skipEl = document.getElementById('skip');
const vlabel = document.getElementById('vlabel');

let W,H,cx,cy;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;cx=W/2;cy=H/2}
resize();window.addEventListener('resize',resize);

// Build chars
['P','u','r','e'].forEach(c=>{const s=document.createElement('span');s.className='char';s.textContent=c;nameEl.appendChild(s)});
['P','u','l','s','e'].forEach(c=>{const s=document.createElement('span');s.className='char accent';s.textContent=c;nameEl.appendChild(s)});
const chars=[...nameEl.querySelectorAll('.char')];

const VC={r:123,g:47,b:255};
const CC={r:0,g:212,b:255};
const WC={r:244,g:244,b:255};
function rgba(col,a){return `rgba(${col.r},${col.g},${col.b},${a})`}
function eout(t){return 1-Math.pow(1-t,3)}
function eout5(t){return 1-Math.pow(1-t,5)}
function lerp(a,b,t){return a+(b-a)*t}

let animDone=false;
let startTime=null;

function animChars(p,blurMode){
  chars.forEach((el,i)=>{
    const thr=i/chars.length;
    const loc=Math.max(0,Math.min(1,(p-thr)/(1/chars.length+0.16)));
    const e=eout5(loc);
    if(blurMode){
      el.style.transform=`scale(${0.4+0.6*e}) translateY(${(1-e)*28}px)`;
      el.style.filter=`blur(${Math.round((1-e)*12)}px)`;
    } else {
      el.style.transform=`translateY(${(1-e)*115}%)`;
      el.style.filter='none';
    }
    el.style.opacity=e;
  });
}

function revealTag(p){
  tagEl.style.opacity=eout(p);
  tagEl.style.transform=`translateY(${(1-eout(p))*8}px)`;
}

function fadeSkip(el){skipEl.style.opacity=Math.min(1,(el-600)/400)}

function exitIntro(){
  if(animDone)return;animDone=true;
  animChars(1,false);
  chars.forEach(el=>{el.style.filter='none';el.style.transform='translateY(0)'});
  tagEl.style.opacity=1;tagEl.style.transform='translateY(0)';
  badgeEl.style.opacity=0;
  const intro=document.getElementById('intro');
  intro.classList.add('exit');
  setTimeout(()=>{document.getElementById('site').classList.add('vis');intro.style.pointerEvents='none'},350);
  setTimeout(()=>{intro.style.display='none'},1300);
}

skipEl.addEventListener('click',exitIntro);
document.getElementById('intro').addEventListener('click',function(e){
  if(e.target===this||e.target===cv){
    if(startTime&&(performance.now()-startTime)>1500)exitIntro();
  }
});

if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){
  animChars(1,false);tagEl.style.opacity=1;skipEl.style.opacity=1;
  setTimeout(exitIntro,900);
} else {
  // ── PICK RANDOM VARIANT ─────────────────────────────
  const VARIANTS=['heartbeat','orbital','gridwarp','collider'];
  const LABELS=['Heartbeat','Orbital','Grid Warp','Collider'];
  const pick=Math.floor(Math.random()*VARIANTS.length);
  const variant=VARIANTS[pick];
  vlabel.textContent=LABELS[pick];
  setTimeout(()=>{vlabel.style.opacity=1},1200);

  // ── RUN CHOSEN VARIANT ──────────────────────────────
  if(variant==='heartbeat') runHeartbeat();
  else if(variant==='orbital') runOrbital();
  else if(variant==='gridwarp') runGridWarp();
  else runCollider();
}

// ═══════════════════════════════════════════════════════
// VARIANT A — HEARTBEAT
// ═══════════════════════════════════════════════════════
function runHeartbeat(){
  badgeEl.style.display='none';
  const D1=2200,D2=900,D3=500,D4=1400,TOTAL=D1+D2+D3+D4;
  const particles=[];

  function spawnP(x,y){
    particles.push({x,y,vx:(Math.random()-0.5)*1.2,vy:(Math.random()-0.85)*1.6,
      life:1,decay:0.012+Math.random()*0.014,size:1.5+Math.random()*2.5,
      col:Math.random()<0.5?VC:CC});
  }

  function buildWave(w,h){
    const y0=h*0.5,amp=h*0.12,pts=[],steps=600;
    for(let i=0;i<=steps;i++){
      const t=i/steps,x=t*w;
      let y=y0;
      if(t<0.25){const l=t/0.25;y=y0+Math.sin(l*Math.PI*4)*amp*0.15*l;}
      else if(t<0.35){const l=(t-0.25)/0.1;y=y0-amp*2.6*Math.sin(l*Math.PI);}
      else if(t<0.42){const l=(t-0.35)/0.07;y=y0+amp*1.1*Math.sin(l*Math.PI);}
      else if(t<0.52){const l=(t-0.42)/0.10;y=y0-amp*0.6*Math.sin(l*Math.PI);}
      else if(t<0.75){const l=(t-0.52)/0.23;y=y0+Math.sin(l*Math.PI*3+Math.PI)*amp*0.08*(1-l);}
      pts.push({x,y});
    }
    return pts;
  }

  function frame(ts){
    if(!startTime)startTime=ts;
    const el=ts-startTime;
    if(animDone)return;
    ctx.clearRect(0,0,W,H);

    const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,W*0.5);
    bg.addColorStop(0,rgba(VC,0.07));bg.addColorStop(1,'transparent');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    const p1=Math.min(1,el/D1);
    const pts=buildWave(W,H);
    const endIdx=Math.floor(p1*(pts.length-1));

    if(p1>0){
      // soft glow
      ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<=endIdx;i++)ctx.lineTo(pts[i].x,pts[i].y);
      ctx.strokeStyle=rgba(VC,0.18);ctx.lineWidth=18;ctx.lineCap='round';
      ctx.filter='blur(10px)';ctx.stroke();ctx.filter='none';
      // medium glow
      ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<=endIdx;i++)ctx.lineTo(pts[i].x,pts[i].y);
      ctx.strokeStyle=rgba(VC,0.45);ctx.lineWidth=5;
      ctx.filter='blur(3px)';ctx.stroke();ctx.filter='none';
      // sharp core
      const g=ctx.createLinearGradient(0,0,W,0);
      g.addColorStop(0,rgba(VC,0.9));g.addColorStop(0.5,rgba(VC,1));g.addColorStop(1,rgba(CC,1));
      ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<=endIdx;i++)ctx.lineTo(pts[i].x,pts[i].y);
      ctx.strokeStyle=g;ctx.lineWidth=1.8;ctx.stroke();
      // tip
      const tip=pts[endIdx];
      const dg=ctx.createRadialGradient(tip.x,tip.y,0,tip.x,tip.y,24);
      dg.addColorStop(0,rgba(CC,0.9));dg.addColorStop(0.3,rgba(VC,0.5));dg.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(tip.x,tip.y,24,0,Math.PI*2);ctx.fillStyle=dg;ctx.fill();
      ctx.beginPath();ctx.arc(tip.x,tip.y,3.5,0,Math.PI*2);ctx.fillStyle=rgba(CC,1);ctx.fill();
      if(p1<0.99&&Math.random()<0.4)spawnP(tip.x,tip.y);
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;p.life-=p.decay;
      if(p.life<=0){particles.splice(i,1);continue;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
      ctx.fillStyle=rgba(p.col,p.life*0.8);ctx.fill();
    }
    if(p1>0.1){
      ctx.fillStyle=rgba(VC,0.015);
      for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
    }
    if(el>D1)animChars(Math.min(1,(el-D1)/D2),false);
    if(el>D1+D2)revealTag(Math.min(1,(el-D1-D2)/D3));
    fadeSkip(el);
    if(el>TOTAL){exitIntro();return;}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════
// VARIANT B — ORBITAL
// ═══════════════════════════════════════════════════════
function runOrbital(){
  badgeEl.style.display='none';
  const D1=1800,D2=800,D3=500,D4=1600,TOTAL=D1+D2+D3+D4;
  const rings=[
    {r:0.18,speed:0.00022,phase:0,dots:4,col:VC},
    {r:0.26,speed:-0.00015,phase:1.1,dots:6,col:CC},
    {r:0.35,speed:0.00010,phase:2.5,dots:3,col:{r:160,g:102,b:255}},
  ];
  const pts=Array.from({length:90},()=>({
    x:Math.random(),y:Math.random(),
    vx:(Math.random()-0.5)*0.0003,vy:(Math.random()-0.5)*0.0003,
    s:0.6+Math.random()*2,a:0.1+Math.random()*0.4,
    col:Math.random()<0.6?VC:CC,
  }));

  function frame(ts){
    if(!startTime)startTime=ts;
    const el=ts-startTime;
    if(animDone)return;
    ctx.clearRect(0,0,W,H);
    const p1=Math.min(1,el/D1);

    const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.6);
    bg.addColorStop(0,rgba(VC,0.09*p1));bg.addColorStop(1,'transparent');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0;
      ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.s,0,Math.PI*2);
      ctx.fillStyle=rgba(p.col,p.a*p1);ctx.fill();
    });

    rings.forEach(ring=>{
      const rad=Math.min(W,H)*ring.r*p1;
      ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);
      ctx.strokeStyle=rgba(ring.col,0.12*p1);ctx.lineWidth=1;
      ctx.setLineDash([4,8]);ctx.stroke();ctx.setLineDash([]);
      for(let d=0;d<ring.dots;d++){
        const angle=ring.phase+d*(Math.PI*2/ring.dots)+ts*ring.speed;
        const dx=cx+Math.cos(angle)*rad,dy=cy+Math.sin(angle)*rad;
        const dg=ctx.createRadialGradient(dx,dy,0,dx,dy,14);
        dg.addColorStop(0,rgba(ring.col,0.7*p1));dg.addColorStop(1,'transparent');
        ctx.beginPath();ctx.arc(dx,dy,14,0,Math.PI*2);ctx.fillStyle=dg;ctx.fill();
        ctx.beginPath();ctx.arc(dx,dy,2.5,0,Math.PI*2);ctx.fillStyle=rgba(ring.col,p1);ctx.fill();
      }
    });

    if(p1>0.3){
      const cp=Math.min(1,(p1-0.3)/0.7);
      const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.08);
      cg.addColorStop(0,rgba({r:160,g:102,b:255},0.5*cp));
      cg.addColorStop(0.5,rgba(VC,0.15*cp));cg.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(cx,cy,Math.min(W,H)*0.08,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();
      ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fillStyle=rgba(WC,0.9*cp);ctx.fill();
    }

    if(el>D1)animChars(Math.min(1,(el-D1)/D2),false);
    if(el>D1+D2)revealTag(Math.min(1,(el-D1-D2)/D3));
    fadeSkip(el);
    if(el>TOTAL){exitIntro();return;}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════
// VARIANT C — GRID WARP
// ═══════════════════════════════════════════════════════
function runGridWarp(){
  badgeEl.style.display='none';
  const D1=2400,D2=900,D3=500,D4=1800,TOTAL=D1+D2+D3+D4;
  const COLS=28,ROWS=18;
  const nodes=[];
  for(let r=0;r<=ROWS;r++)for(let c=0;c<=COLS;c++){
    const nx=c/COLS,ny=r/ROWS,dx=nx-0.5,dy=ny-0.5;
    nodes.push({nx,ny,dist:Math.sqrt(dx*dx+dy*dy),phase:Math.sqrt(dx*dx+dy*dy)*6+Math.random()*0.5});
  }

  function nodePos(r,c,t,maxW,p1){
    const n=nodes[r*(COLS+1)+c];
    const mw=Math.min(W/COLS,H/ROWS)*0.55;
    const wave=Math.sin(t*1.2+n.phase)*mw*p1*(1-n.dist*0.8);
    const wave2=Math.cos(t*0.9+n.phase*1.3)*mw*0.4*p1*(1-n.dist*0.6);
    return{x:n.nx*W+wave*0.5+wave2*0.3,y:n.ny*H+wave*0.4+wave2*0.5};
  }

  function frame(ts){
    if(!startTime)startTime=ts;
    const el=ts-startTime;
    if(animDone)return;
    ctx.clearRect(0,0,W,H);
    const p1=Math.min(1,el/D1),t=el*0.001;

    const pulse=0.5+0.5*Math.sin(t*1.8);
    const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.55);
    bg.addColorStop(0,rgba(VC,(0.06+pulse*0.04)*p1));
    bg.addColorStop(0.5,rgba(CC,0.03*p1));bg.addColorStop(1,'transparent');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    for(let r=0;r<=ROWS;r++){
      for(let c=0;c<COLS;c++){
        const a=nodePos(r,c,t,W,p1),b=nodePos(r,c+1,t,W,p1);
        const frac=1-(Math.abs(r/ROWS-0.5)*2);
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=rgba(VC,0.06*frac*p1);ctx.lineWidth=0.8;ctx.stroke();
      }
    }
    for(let c=0;c<=COLS;c++){
      for(let r=0;r<ROWS;r++){
        const a=nodePos(r,c,t,W,p1),b=nodePos(r+1,c,t,W,p1);
        const frac=1-(Math.abs(c/COLS-0.5)*2);
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=rgba(CC,0.06*frac*p1);ctx.lineWidth=0.8;ctx.stroke();
      }
    }
    for(let r=0;r<=ROWS;r++)for(let c=0;c<=COLS;c++){
      const n=nodes[r*(COLS+1)+c];if(n.dist>0.3)continue;
      const pos=nodePos(r,c,t,W,p1);
      const br=(0.3-n.dist)/0.3,fl=0.7+0.3*Math.sin(t*3+n.phase*2);
      ctx.beginPath();ctx.arc(pos.x,pos.y,1.5,0,Math.PI*2);
      ctx.fillStyle=rgba({r:160,g:102,b:255},br*fl*p1*0.7);ctx.fill();
    }
    if(p1<0.8){
      const sy=p1*(1/0.8)*H;
      const sg=ctx.createLinearGradient(0,sy-60,0,sy+10);
      sg.addColorStop(0,'transparent');sg.addColorStop(0.7,rgba(VC,0.06));sg.addColorStop(1,rgba(CC,0.18));
      ctx.fillStyle=sg;ctx.fillRect(0,sy-60,W,70);
    }

    if(el>D1)animChars(Math.min(1,(el-D1)/D2),false);
    if(el>D1+D2)revealTag(Math.min(1,(el-D1-D2)/D3));
    fadeSkip(el);
    if(el>TOTAL){exitIntro();return;}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════
// VARIANT D — COLLIDER
// ═══════════════════════════════════════════════════════
function runCollider(){
  document.getElementById('badgeText').textContent='Initializing collision sequence';
  const SPINUP=800,BEAM_SPEED=0.0022;
  const COLLISION_COOLDOWN=600,COLLISION_THRESHOLD=0.18;
  const LOGO_REVEAL_DUR=900,HOLD_DUR=2000;
  const TICK_COUNT=60,NODE_COUNT=8;
  const RINGS=[
    {r:1.00,alpha:0.12,dash:[6,10],width:1.0},
    {r:0.82,alpha:0.07,dash:[3,14],width:0.7},
    {r:1.18,alpha:0.07,dash:[3,14],width:0.7},
    {r:0.64,alpha:0.05,dash:[2,18],width:0.5},
    {r:1.36,alpha:0.05,dash:[2,18],width:0.5},
  ];
  let collisionCount=0,lastCollision=-999,logoRevealStart=null,totalEnd=null;
  const explosions=[];

  function spawnExplosion(x,y,pc,sc){
    const count=60+Math.floor(Math.random()*40);
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2,spd=1+Math.random()*4.5;
      explosions.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
        life:1,decay:0.008+Math.random()*0.018,
        size:1.2+Math.random()*3,col:Math.random()<0.5?pc:sc,
        glow:Math.random()<0.3});
    }
  }

  function frame(ts){
    if(!startTime)startTime=ts;
    const el=ts-startTime;
    if(animDone)return;
    ctx.clearRect(0,0,W,H);

    const R=Math.min(W,H)*0.33;
    const spinP=Math.min(1,el/SPINUP),ramp=eout5(spinP);

    const ag=ctx.createRadialGradient(cx,cy,0,cx,cy,R*2.2);
    ag.addColorStop(0,rgba(VC,0.07*ramp));ag.addColorStop(0.4,rgba(CC,0.03*ramp));ag.addColorStop(1,'transparent');
    ctx.fillStyle=ag;ctx.fillRect(0,0,W,H);

    RINGS.forEach(ring=>{
      ctx.beginPath();ctx.arc(cx,cy,R*ring.r,0,Math.PI*2);
      ctx.strokeStyle=rgba(VC,ring.alpha*ramp);ctx.lineWidth=ring.width;
      ctx.setLineDash(ring.dash);ctx.stroke();ctx.setLineDash([]);
    });
    for(let i=0;i<TICK_COUNT;i++){
      const a=(i/TICK_COUNT)*Math.PI*2,maj=i%5===0;
      const len=maj?10:5,r0=R-len/2,r1=R+len/2;
      ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);
      ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
      ctx.strokeStyle=rgba(maj?WC:VC,(maj?0.15:0.07)*ramp);ctx.lineWidth=maj?1.2:0.7;ctx.stroke();
    }
    for(let i=0;i<NODE_COUNT;i++){
      const a=(i/NODE_COUNT)*Math.PI*2,nx=cx+Math.cos(a)*R,ny=cy+Math.sin(a)*R;
      const ng=ctx.createRadialGradient(nx,ny,0,nx,ny,8);
      ng.addColorStop(0,rgba(VC,0.5*ramp));ng.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(nx,ny,8,0,Math.PI*2);ctx.fillStyle=ng;ctx.fill();
      ctx.beginPath();ctx.arc(nx,ny,2.5,0,Math.PI*2);ctx.fillStyle=rgba(WC,0.6*ramp);ctx.fill();
    }

    const elapsed_s=Math.max(0,el-SPINUP)*0.001;
    const speedRamp=Math.min(1,elapsed_s/0.4);
    const angleA=elapsed_s*BEAM_SPEED*1000*speedRamp;
    const angleB=Math.PI-elapsed_s*BEAM_SPEED*1000*speedRamp;

    const TRAIL=90;
    function drawBeamTrail(angle,dir,col){
      for(let i=1;i<TRAIL;i++){
        const pa=angle-dir*i*(1.8*speedRamp/TRAIL);
        const x1=cx+Math.cos(pa+(dir/TRAIL))*R,y1=cy+Math.sin(pa+(dir/TRAIL))*R;
        const x2=cx+Math.cos(pa)*R,y2=cy+Math.sin(pa)*R;
        const frac=i/TRAIL,alpha=(1-frac)*0.7*ramp,width=lerp(3.5,0.3,frac);
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
        ctx.strokeStyle=rgba(col,alpha);ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke();
        if(i<TRAIL*0.4){
          ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
          ctx.strokeStyle=rgba(col,(1-frac/0.4)*0.12*ramp);ctx.lineWidth=18;ctx.stroke();
        }
      }
    }
    drawBeamTrail(angleA,1,VC);
    drawBeamTrail(angleB,-1,CC);

    function beamHead(angle,col){
      const x=cx+Math.cos(angle)*R,y=cy+Math.sin(angle)*R;
      const hg=ctx.createRadialGradient(x,y,0,x,y,22);
      hg.addColorStop(0,rgba(col,0.9*ramp));hg.addColorStop(0.3,rgba(col,0.35*ramp));hg.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fillStyle=hg;ctx.fill();
      ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=rgba(WC,ramp);ctx.fill();
      return{x,y};
    }
    const hA=beamHead(angleA,VC),hB=beamHead(angleB,CC);

    const ad=Math.abs((angleA%(Math.PI*2))-(angleB%(Math.PI*2)));
    const nd=Math.min(ad,Math.PI*2-ad);
    if(nd<COLLISION_THRESHOLD&&speedRamp>0.8&&el-lastCollision>COLLISION_COOLDOWN){
      lastCollision=el;collisionCount++;
      spawnExplosion((hA.x+hB.x)/2,(hA.y+hB.y)/2,VC,CC);
      if(collisionCount===3&&!logoRevealStart)logoRevealStart=el;
    }

    for(let i=explosions.length-1;i>=0;i--){
      const p=explosions[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.97;p.vy*=0.97;p.life-=p.decay;
      if(p.life<=0){explosions.splice(i,1);continue;}
      if(p.glow){
        const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*4);
        pg.addColorStop(0,rgba(p.col,p.life*0.6));pg.addColorStop(1,'transparent');
        ctx.beginPath();ctx.arc(p.x,p.y,p.size*4,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();
      }
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*Math.max(0.1,p.life),0,Math.PI*2);
      ctx.fillStyle=rgba(p.col,p.life*0.9);ctx.fill();
    }

    if(logoRevealStart!==null){
      const lp=Math.min(1,(el-logoRevealStart)/LOGO_REVEAL_DUR);
      animChars(lp,false);
      if(lp>0.6)revealTag((lp-0.6)/0.4);
      if(lp>0.2)badgeEl.style.opacity=Math.max(0,1-eout((lp-0.2)/0.4));
      if(lp>=1&&!totalEnd)totalEnd=el+HOLD_DUR;
    } else {
      if(el>400)badgeEl.style.opacity=Math.min(0.8,(el-400)/600);
    }

    fadeSkip(el);
    if(totalEnd&&el>totalEnd){exitIntro();return;}
    // Safety: if no collision after 8s, force reveal
    if(!logoRevealStart&&el>8000){logoRevealStart=el;}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
