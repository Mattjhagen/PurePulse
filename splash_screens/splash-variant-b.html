<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PurePulse — Variant B: Grid Warp</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07070D;--v:#7B2FFF;--vg:#A066FF;--c:#00D4FF;--w:#F4F4FF;--mu:rgba(244,244,255,0.35)}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Space Grotesk',sans-serif;color:var(--w)}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.lw{position:relative;z-index:2;text-align:center}
.ln{font-size:clamp(3.5rem,9vw,8.5rem);font-weight:700;letter-spacing:-0.03em;line-height:1;display:flex;overflow:hidden}
.char{display:inline-block;transform:translateY(120%);opacity:0}
.accent{color:var(--vg)}
.lt{margin-top:0.9rem;font-family:'Inter',sans-serif;font-size:clamp(0.7rem,1.8vw,0.95rem);font-weight:300;letter-spacing:0.3em;text-transform:uppercase;color:var(--mu);opacity:0;transform:translateY(6px)}
.sub{margin-top:0.5rem;font-family:'Inter',sans-serif;font-size:clamp(0.6rem,1.4vw,0.75rem);font-weight:300;letter-spacing:0.18em;text-transform:uppercase;color:rgba(160,102,255,0.55);opacity:0}
#skip{position:absolute;bottom:2rem;right:2.5rem;font-family:'Inter',sans-serif;font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--mu);background:none;border:none;cursor:pointer;opacity:0;transition:color 0.2s;display:flex;align-items:center;gap:0.4rem}
#skip:hover{color:var(--w)}
#intro.exit{animation:out 0.85s cubic-bezier(0.76,0,0.24,1) forwards}
@keyframes out{to{opacity:0;transform:scale(1.03)}}
#site{position:fixed;inset:0;opacity:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s ease 0.4s;font-family:'Space Grotesk',sans-serif;color:var(--w)}
#site.vis{opacity:1}
nav{position:absolute;top:0;left:0;right:0;padding:2rem 2.5rem;display:flex;align-items:center;justify-content:space-between}
.nl{font-size:1.1rem;font-weight:700;letter-spacing:-0.02em}.nl span{color:var(--vg)}
.nr{display:flex;gap:2rem;list-style:none}
.nr a{font-size:0.82rem;color:var(--mu);text-decoration:none;transition:color 0.2s}.nr a:hover{color:var(--w)}
.hero{text-align:center;max-width:780px;padding:0 2rem}
.hero h1{font-size:clamp(2.2rem,5.5vw,4.8rem);font-weight:700;line-height:1.05;letter-spacing:-0.03em;margin-bottom:1.4rem}
.hero h1 em{font-style:normal;color:var(--vg)}
.hero p{font-family:'Inter',sans-serif;font-size:1.05rem;font-weight:300;color:var(--mu);line-height:1.7;max-width:520px;margin:0 auto 2.2rem}
.cta{display:inline-flex;align-items:center;gap:0.5rem;background:var(--v);color:#fff;padding:0.8rem 1.9rem;border-radius:100px;font-size:0.88rem;font-weight:600;letter-spacing:0.02em;text-decoration:none;box-shadow:0 0 36px rgba(123,47,255,0.3);transition:box-shadow 0.3s,transform 0.2s}
.cta:hover{box-shadow:0 0 60px rgba(123,47,255,0.5);transform:translateY(-2px)}
</style>
</head>
<body>
<div id="intro">
  <canvas id="c"></canvas>
  <div class="lw">
    <div class="ln" id="name"></div>
    <div class="lt" id="tag">Web Design &amp; Development</div>
    <div class="sub" id="sub">Omaha, Nebraska &nbsp;·&nbsp; purepulse.one</div>
  </div>
  <button id="skip">Skip <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h8M7 3l3 3-3 3"/></svg></button>
</div>
<div id="site">
  <nav><div class="nl">Pure<span>Pulse</span></div><ul class="nr"><li><a href="#">Work</a></li><li><a href="#">Services</a></li><li><a href="#">About</a></li><li><a href="#">Contact</a></li></ul></nav>
  <div class="hero"><h1>Design that <em>moves</em><br>people forward</h1><p>PurePulse builds web experiences with sharp aesthetics, clean code, and creative instinct on every scroll.</p><a href="#" class="cta">See our work ↗</a></div>
</div>
<script>
const W1='Pure',W2='Pulse';
const nameEl=document.getElementById('name');
[...W1].forEach(c=>{const s=document.createElement('span');s.className='char';s.textContent=c;nameEl.appendChild(s)});
[...W2].forEach(c=>{const s=document.createElement('span');s.className='char accent';s.textContent=c;nameEl.appendChild(s)});
const chars=[...nameEl.querySelectorAll('.char')];

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,cx,cy;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;cx=W/2;cy=H/2}
resize();window.addEventListener('resize',resize);

function rgba(r,g,b,a){return `rgba(${r},${g},${b},${a})`}
function eout(t){return 1-Math.pow(1-t,3)}
function einout(t){return t<0.5?2*t*t:-1+(4-2*t)*t}

let start=null,done=false;
const D1=2400,D2=900,D3=500,D4=1800,TOTAL=D1+D2+D3+D4;

// Grid
const COLS=28,ROWS=18;
// Each node has a wave phase based on distance from center
function gridNodes(){
  const nodes=[];
  for(let r=0;r<=ROWS;r++)for(let c=0;c<=COLS;c++){
    const nx=c/COLS,ny=r/ROWS;
    const dx=nx-0.5,dy=ny-0.5;
    const dist=Math.sqrt(dx*dx+dy*dy);
    nodes.push({nx,ny,dist,phase:dist*6+Math.random()*0.5});
  }
  return nodes;
}
const nodes=gridNodes();

function frame(ts){
  if(!start)start=ts;
  const el=ts-start;
  if(done)return;
  ctx.clearRect(0,0,W,H);

  const p1=Math.min(1,el/D1);
  const t=el*0.001;

  // bg glow pulse
  const pulse=0.5+0.5*Math.sin(t*1.8);
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.55);
  bg.addColorStop(0,rgba(123,47,255,(0.06+pulse*0.04)*p1));
  bg.addColorStop(0.5,rgba(0,212,255,0.03*p1));
  bg.addColorStop(1,'transparent');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Warped grid
  const cellW=W/COLS,cellH=H/ROWS;
  const maxWarp=Math.min(cellW,cellH)*0.55;

  function nodePos(r,c){
    const idx=r*(COLS+1)+c;
    const n=nodes[idx];
    const wave=Math.sin(t*1.2+n.phase)*maxWarp*p1*(1-n.dist*0.8);
    const wave2=Math.cos(t*0.9+n.phase*1.3)*maxWarp*0.4*p1*(1-n.dist*0.6);
    const dist2center=n.dist;
    const pull=1-dist2center*1.2;
    return{
      x:n.nx*W+wave*0.5+wave2*0.3,
      y:n.ny*H+wave*0.4+wave2*0.5,
    }
  }

  // Draw grid lines
  for(let r=0;r<=ROWS;r++){
    for(let c=0;c<COLS;c++){
      const a=nodePos(r,c);
      const b=nodePos(r,c+1);
      const frac=1-(Math.abs(r/ROWS-0.5)*2);
      const alpha=0.06*frac*p1;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=rgba(123,47,255,alpha);ctx.lineWidth=0.8;ctx.stroke();
    }
  }
  for(let c=0;c<=COLS;c++){
    for(let r=0;r<ROWS;r++){
      const a=nodePos(r,c);
      const b=nodePos(r+1,c);
      const frac=1-(Math.abs(c/COLS-0.5)*2);
      const alpha=0.06*frac*p1;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=rgba(0,212,255,alpha);ctx.lineWidth=0.8;ctx.stroke();
    }
  }

  // Bright intersection nodes near center
  for(let r=0;r<=ROWS;r++)for(let c=0;c<=COLS;c++){
    const n=nodes[r*(COLS+1)+c];
    if(n.dist>0.3)continue;
    const pos=nodePos(r,c);
    const brightness=(0.3-n.dist)/0.3;
    const flicker=0.7+0.3*Math.sin(t*3+n.phase*2);
    ctx.beginPath();ctx.arc(pos.x,pos.y,1.5,0,Math.PI*2);
    ctx.fillStyle=rgba(160,102,255,brightness*flicker*p1*0.7);ctx.fill();
  }

  // Scan line that sweeps from top on entry
  if(p1<0.8){
    const scanY=p1*(1/0.8)*H;
    const sg=ctx.createLinearGradient(0,scanY-60,0,scanY+10);
    sg.addColorStop(0,'transparent');
    sg.addColorStop(0.7,rgba(123,47,255,0.06));
    sg.addColorStop(1,rgba(0,212,255,0.18));
    ctx.fillStyle=sg;ctx.fillRect(0,scanY-60,W,70);
  }

  // Phase 2: chars
  if(el>D1)animChars(Math.min(1,(el-D1)/D2));
  // Phase 3: tag + sub
  if(el>D1+D2){
    const p3=eout(Math.min(1,(el-D1-D2)/D3));
    const tg=document.getElementById('tag');tg.style.opacity=p3;tg.style.transform=`translateY(${(1-p3)*6}px)`;
    const sb=document.getElementById('sub');sb.style.opacity=p3*0.7;
  }
  // skip
  if(el>500)document.getElementById('skip').style.opacity=Math.min(1,(el-500)/400);
  if(el>TOTAL){exitIntro();return}
  requestAnimationFrame(frame);
}

function animChars(p){
  chars.forEach((el,i)=>{
    const thr=i/chars.length;
    const loc=Math.max(0,Math.min(1,(p-thr)/(1/chars.length+0.18)));
    const e=eout(loc);
    el.style.transform=`translateY(${(1-e)*120}%)`;
    el.style.opacity=e;
  });
}

function exitIntro(){
  if(done)return;done=true;
  animChars(1);
  const tg=document.getElementById('tag');tg.style.opacity=1;tg.style.transform='translateY(0)';
  const intro=document.getElementById('intro');
  intro.classList.add('exit');
  setTimeout(()=>{document.getElementById('site').classList.add('vis');intro.style.pointerEvents='none'},300);
  setTimeout(()=>{intro.style.display='none'},1200);
}
document.getElementById('skip').addEventListener('click',exitIntro);
if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){animChars(1);setTimeout(exitIntro,800)}
else requestAnimationFrame(frame);
</script>
</body>
</html>
