<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PurePulse — Variant C: Bloom</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07070D;--v:#7B2FFF;--vg:#A066FF;--c:#00D4FF;--w:#F4F4FF;--mu:rgba(244,244,255,0.35)}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Space Grotesk',sans-serif;color:var(--w)}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.lw{position:relative;z-index:2;text-align:center}
.ln{font-size:clamp(3.5rem,9vw,8.5rem);font-weight:700;letter-spacing:-0.03em;line-height:1;display:flex;overflow:hidden;justify-content:center}
.char{display:inline-block;transform:scale(0.4) translateY(30px);opacity:0;filter:blur(12px)}
.accent{color:var(--vg)}
.lt{margin-top:0.9rem;font-family:'Inter',sans-serif;font-size:clamp(0.7rem,1.8vw,0.95rem);font-weight:300;letter-spacing:0.3em;text-transform:uppercase;color:var(--mu);opacity:0}
#skip{position:absolute;bottom:2rem;right:2.5rem;font-family:'Inter',sans-serif;font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--mu);background:none;border:none;cursor:pointer;opacity:0;transition:color 0.2s;display:flex;align-items:center;gap:0.4rem}
#skip:hover{color:var(--w)}
#intro.exit{animation:out 0.85s cubic-bezier(0.76,0,0.24,1) forwards}
@keyframes out{to{opacity:0;transform:scale(1.03)}}
#site{position:fixed;inset:0;opacity:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s ease 0.4s;font-family:'Space Grotesk',sans-serif;color:var(--w)}
#site.vis{opacity:1}
nav{position:absolute;top:0;left:0;right:0;padding:2rem 2.5rem;display:flex;align-items:center;justify-content:space-between}
.nl{font-size:1.1rem;font-weight:700;letter-spacing:-0.02em}.nl span{color:var(--vg)}
.nr{display:flex;gap:2rem;list-style:none}
.nr a{font-size:0.82rem;color:var(--mu);text-decoration:none;transition:color 0.2s}.nr a:hover{color:var(--w)}
.hero{text-align:center;max-width:780px;padding:0 2rem}
.hero h1{font-size:clamp(2.2rem,5.5vw,4.8rem);font-weight:700;line-height:1.05;letter-spacing:-0.03em;margin-bottom:1.4rem}
.hero h1 em{font-style:normal;color:var(--vg)}
.hero p{font-family:'Inter',sans-serif;font-size:1.05rem;font-weight:300;color:var(--mu);line-height:1.7;max-width:520px;margin:0 auto 2.2rem}
.cta{display:inline-flex;align-items:center;gap:0.5rem;background:var(--v);color:#fff;padding:0.8rem 1.9rem;border-radius:100px;font-size:0.88rem;font-weight:600;letter-spacing:0.02em;text-decoration:none;box-shadow:0 0 36px rgba(123,47,255,0.3);transition:box-shadow 0.3s,transform 0.2s}
.cta:hover{box-shadow:0 0 60px rgba(123,47,255,0.5);transform:translateY(-2px)}
</style>
</head>
<body>
<div id="intro">
  <canvas id="c"></canvas>
  <div class="lw">
    <div class="ln" id="name"></div>
    <div class="lt" id="tag">Web Design &amp; Development</div>
  </div>
  <button id="skip">Skip <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h8M7 3l3 3-3 3"/></svg></button>
</div>
<div id="site">
  <nav><div class="nl">Pure<span>Pulse</span></div><ul class="nr"><li><a href="#">Work</a></li><li><a href="#">Services</a></li><li><a href="#">About</a></li><li><a href="#">Contact</a></li></ul></nav>
  <div class="hero"><h1>Design that <em>moves</em><br>people forward</h1><p>PurePulse builds web experiences with sharp aesthetics, clean code, and creative instinct on every scroll.</p><a href="#" class="cta">See our work ↗</a></div>
</div>
<script>
const W1='Pure',W2='Pulse';
const nameEl=document.getElementById('name');
[...W1].forEach(c=>{const s=document.createElement('span');s.className='char';s.textContent=c;nameEl.appendChild(s)});
[...W2].forEach(c=>{const s=document.createElement('span');s.className='char accent';s.textContent=c;nameEl.appendChild(s)});
const chars=[...nameEl.querySelectorAll('.char')];

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,cx,cy;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;cx=W/2;cy=H/2}
resize();window.addEventListener('resize',resize);

function rgba(r,g,b,a){return `rgba(${r},${g},${b},${a})`}
function eout3(t){return 1-Math.pow(1-t,3)}
function eout5(t){return 1-Math.pow(1-t,5)}

let start=null,done=false;
const D1=2000,D2=1000,D3=500,D4=1600,TOTAL=D1+D2+D3+D4;

// Bloom rings: each expands and fades
const blooms=[];
function spawnBloom(delay){
  blooms.push({delay,r:0,maxR:0,alpha:0,born:false,col:Math.random()<0.6?[123,47,255]:[0,212,255]});
}
// Pre-spawn a sequence of blooms
[0,200,450,750,1100,1500].forEach(spawnBloom);

// Fluid tendrils (bezier paths that animate)
function makeTendril(angle,len){
  return{
    angle,len,
    cp1:{dx:Math.cos(angle+0.8)*len*0.4,dy:Math.sin(angle+0.8)*len*0.4},
    cp2:{dx:Math.cos(angle-0.5)*len*0.8,dy:Math.sin(angle-0.5)*len*0.8},
    col:Math.random()<0.5?[123,47,255]:[0,212,255],
    progress:0,
  }
}
const tendrils=Array.from({length:14},(_,i)=>makeTendril((i/14)*Math.PI*2,Math.min(W,H)*0.32));

function frame(ts){
  if(!start)start=ts;
  const el=ts-start;
  if(done)return;
  ctx.clearRect(0,0,W,H);

  const p1=Math.min(1,el/D1);
  const t=el*0.001;

  // Ambient bg breath
  const breath=0.5+0.5*Math.sin(t*1.5);
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.6);
  bg.addColorStop(0,rgba(123,47,255,(0.05+breath*0.03)*p1));
  bg.addColorStop(0.6,rgba(0,212,255,0.02*p1));
  bg.addColorStop(1,'transparent');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Update + draw blooms
  blooms.forEach(b=>{
    if(el<b.delay)return;
    if(!b.born){b.born=true;b.maxR=Math.min(W,H)*(0.25+Math.random()*0.25)}
    const age=(el-b.delay)*0.0008;
    b.r=Math.min(b.maxR,b.maxR*eout5(age));
    b.alpha=age<0.5?age*2:(2-age*1.5);
    if(b.alpha<=0)return;

    const layers=[
      {offset:0,width:b.r*0.18,opacity:0.04},
      {offset:0,width:b.r*0.06,opacity:0.08},
      {offset:0,width:2,opacity:0.25},
    ];
    layers.forEach(l=>{
      ctx.beginPath();
      ctx.arc(cx,cy,Math.max(1,b.r-l.offset),0,Math.PI*2);
      ctx.strokeStyle=rgba(b.col[0],b.col[1],b.col[2],b.alpha*l.opacity*p1);
      ctx.lineWidth=l.width;
      ctx.stroke();
    });
  });

  // Tendrils grow outward from center
  tendrils.forEach((td,i)=>{
    const delay=i*120;
    if(el<delay)return;
    td.progress=Math.min(1,(el-delay)/(D1*0.7));
    const ep=eout3(td.progress);

    const ex=cx+Math.cos(td.angle)*td.len*ep;
    const ey=cy+Math.sin(td.angle)*td.len*ep;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.bezierCurveTo(
      cx+td.cp1.dx*ep,cy+td.cp1.dy*ep,
      cx+td.cp2.dx*ep,cy+td.cp2.dy*ep,
      ex,ey
    );
    const alpha=(0.5-Math.abs(td.progress-0.5))*0.3;
    ctx.strokeStyle=rgba(td.col[0],td.col[1],td.col[2],alpha*p1);
    ctx.lineWidth=1.5;
    ctx.stroke();

    // tip glow
    if(td.progress>0.1&&td.progress<0.95){
      const tg=ctx.createRadialGradient(ex,ey,0,ex,ey,12);
      tg.addColorStop(0,rgba(td.col[0],td.col[1],td.col[2],0.5*td.progress*p1));
      tg.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(ex,ey,12,0,Math.PI*2);
      ctx.fillStyle=tg;ctx.fill();
    }
  });

  // Core: pulsing bright center
  if(p1>0.2){
    const cp=Math.min(1,(p1-0.2)/0.8);
    const pls=0.5+0.5*Math.sin(t*4);
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.06*(1+pls*0.2));
    cg.addColorStop(0,rgba(244,244,255,0.85*cp));
    cg.addColorStop(0.3,rgba(160,102,255,0.4*cp));
    cg.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(cx,cy,Math.min(W,H)*0.06*(1+pls*0.2),0,Math.PI*2);
    ctx.fillStyle=cg;ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);
    ctx.fillStyle=rgba(244,244,255,cp);ctx.fill();
  }

  // Phase 2: char bloom-in (scale+blur to normal)
  if(el>D1)animChars(Math.min(1,(el-D1)/D2));
  if(el>D1+D2){
    const p3=eout3(Math.min(1,(el-D1-D2)/D3));
    const tg=document.getElementById('tag');tg.style.opacity=p3;
  }
  if(el>500)document.getElementById('skip').style.opacity=Math.min(1,(el-500)/400);
  if(el>TOTAL){exitIntro();return}
  requestAnimationFrame(frame);
}

function animChars(p){
  chars.forEach((el,i)=>{
    const thr=i/chars.length;
    const loc=Math.max(0,Math.min(1,(p-thr)/(1/chars.length+0.2)));
    const e=eout5(loc);
    const sc=0.4+0.6*e;
    const bl=Math.round((1-e)*12);
    el.style.transform=`scale(${sc}) translateY(${(1-e)*30}px)`;
    el.style.filter=`blur(${bl}px)`;
    el.style.opacity=e;
  });
}

function exitIntro(){
  if(done)return;done=true;
  animChars(1);
  chars.forEach(el=>{el.style.filter='none';el.style.transform='scale(1) translateY(0)'});
  document.getElementById('tag').style.opacity=1;
  const intro=document.getElementById('intro');
  intro.classList.add('exit');
  setTimeout(()=>{document.getElementById('site').classList.add('vis');intro.style.pointerEvents='none'},300);
  setTimeout(()=>{intro.style.display='none'},1200);
}
document.getElementById('skip').addEventListener('click',exitIntro);
if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){animChars(1);setTimeout(exitIntro,800)}
else requestAnimationFrame(frame);
</script>
</body>
</html>
